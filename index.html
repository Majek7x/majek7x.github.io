/* =====================================================================
   3) PRIMITIVES — Reveal (scroll animation) + Section header + hooks
   ===================================================================== */
function Reveal({ children, delay = 0, className = "", as: Tag = "div" }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { el.classList.add("is-in"); io.disconnect(); }
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <Tag ref={ref} className={"reveal " + className} style={{ transitionDelay: delay + "ms" }}>
      {children}
    </Tag>
  );
}

function useScrollSpy(ids) {
  const [active, setActive] = useState("");
  useEffect(() => {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: "-40% 0px -55% 0px" });
    ids.forEach((id) => { const el = document.getElementById(id); if (el) obs.observe(el); });
    return () => obs.disconnect();
  }, []);
  return active;
}

function Terminal() {
  const [p, setP] = useState({ li: 0, ci: 0, done: false });
  useEffect(() => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      setP({ li: TERMINAL_SCRIPT.length - 1, ci: TERMINAL_SCRIPT[TERMINAL_SCRIPT.length - 1].text.length, done: true });
      return;
    }
    let cancelled = false, t, li = 0, ci = 0;
    const step = () => {
      if (cancelled) return;
      const line = TERMINAL_SCRIPT[li];
      if (ci < line.text.length) {
        ci++; setP({ li, ci, done: false });
        t = setTimeout(step, line.cls === "cmd" ? 40 : 10);
      } else if (li < TERMINAL_SCRIPT.length - 1) {
        li++; ci = 0; setP({ li, ci, done: false });
        t = setTimeout(step, 300);
      } else {
        setP({ li, ci, done: true });
        t = setTimeout(() => {
          if (cancelled) return;
          li = 0; ci = 0; setP({ li, ci, done: false });
          t = setTimeout(step, 400);
        }, 5000);
      }
    };
    t = setTimeout(step, 600);
    return () => { cancelled = true; clearTimeout(t); };
  }, []);

  return (
    <div className="rounded-lg border border-line bg-panel shadow-2xl shadow-black/40 overflow-hidden"
         role="img" aria-label="Terminal animation showing my four-step penetration testing methodology: scope, recon, test, report.">
      <div className="flex items-center gap-1.5 px-4 py-2.5 border-b border-line bg-ink/60">
        <span className="w-2.5 h-2.5 rounded-full bg-[#FF5F56]"></span>
        <span className="w-2.5 h-2.5 rounded-full bg-[#FFBD2E]"></span>
        <span className="w-2.5 h-2.5 rounded-full bg-[#27C93F]"></span>
        <span className="ml-3 font-mono text-[11px] text-mut">hassan@sec: ~/methodology.sh</span>
      </div>
      <div className="p-4 sm:p-5 font-mono text-[12px] sm:text-[13px] leading-6 min-h-[15rem]">
        {TERMINAL_SCRIPT.map((line, i) => {
          const text = i < p.li ? line.text : (i === p.li ? line.text.slice(0, p.ci) : "");
          const showCursor = (i === p.li && !p.done) || (p.done && i === TERMINAL_SCRIPT.length - 1);
          const color = line.cls === "cmd" ? "text-txt" : (line.cls === "ok" ? "text-acc" : "text-mut");
          return (
            <div key={i} className={color}>
              {text || "\u00A0"}{showCursor && <span className="cursor" aria-hidden="true"></span>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

                  <p className="text-mut text-sm mt-1.5 leading-relaxed">{a.desc}</p>
                </div>
              </div>
            </Reveal>
          ))}
        </div>

        <Reveal delay={120}>
          <div className="mt-10">
            <h3 className="font-mono text-xs uppercase tracking-widest text-mut mb-4 flex items-center gap-2">
              <Icon name="bookOpen" size={14} className="text-acc" /> Study Library
            </h3>
            <div className="grid sm:grid-cols-2 gap-4">
              {LIBRARY.map((b) => (
                <div key={b.title} className="border border-line rounded-lg bg-panel/50 p-5 flex gap-3">
                  <Icon name="bookOpen" size={16} className="text-acc mt-1 shrink-0" />
                  <div>
                    <h4 className="text-txt text-sm font-medium">{b.title}</h4>
                    <p className="text-mut text-xs mt-1 leading-relaxed">{b.desc}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </Reveal>
      </div>
    </section>
  );
}

function Contact() {
  const [copied, setCopied] = useState(false);
  const [toast, setToast] = useState("");
  const showToast = (m) => { setToast(m); setTimeout(() => setToast(""), 3500); };

  const copyEmail = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1600); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(PROFILE.email).then(done).catch(() => {});
    } else {
      const ta = document.createElement("textarea");
      ta.value = PROFILE.email; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  };

  const onSubmit = (e) => {
    e.preventDefault();
    const f = e.target;
    const fd = new FormData(f);
    const name = (fd.get("name") || "").trim();
    const email = (fd.get("email") || "").trim();
    const msg = (fd.get("message") || "").trim();
    if (!name || !email || !msg) return;
    if (FORM_ENDPOINT) {
      fetch(FORM_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, message: msg }),
      })
        .then(() => { f.reset(); showToast("Message sent — I'll get back to you soon."); })
        .catch(() => showToast("Something went wrong — please email me directly."));
      return;
    }
    const subject = encodeURIComponent("Portfolio contact — " + name);
    const body = encodeURIComponent(msg + "\n\n— " + name + " (" + email + ")");
    window.location.href = "mailto:" + PROFILE.email + "?subject=" + subject + "&body=" + body;
  };

  const rowCls = "flex items-center gap-3 border border-line rounded-lg bg-panel px-4 py-3.5 hover:border-acc/50 transition-colors";

  return (
    <section id="contact" className="py-16 sm:py-24 border-t border-line/60">
      <div className="max-w-6xl mx-auto px-5 sm:px-8">
        <SectionHead no="07" eyebrow="contact" title="Let's Connect"
          desc="Recruiters, teams, and fellow hackers — my inbox is open." />
        <div className="grid lg:grid-cols-[1fr_1.1fr] gap-10">
          <div>
            <Reveal>
              <p className="text-mut leading-relaxed">
                Interested in penetration testing, bug bounty, or security training? Feel free to connect with me.
              </p>
            </Reveal>
            <ul className="mt-8 space-y-3">
              <Reveal as="li" delay={60}>
                <div className="flex items-center justify-between gap-3 border border-line rounded-lg bg-panel px-4 py-3.5 hover:border-acc/50 transition-colors">
                  <a href={"mailto:" + PROFILE.email} className="flex items-center gap-3 min-w-0 group">
                    <Icon name="mail" size={17} className="text-acc shrink-0" />
                    <span className="min-w-0">
                      <span className="block font-mono text-[10px] uppercase tracking-widest text-mut">Email</span>
                      <span className="block text-sm text-txt truncate group-hover:text-acc transition-colors">{PROFILE.email}</span>
                    </span>
                  </a>
                  <button onClick={copyEmail}
                          className="font-mono text-[11px] text-mut hover:text-acc border border-line px-2.5 py-1 rounded shrink-0 transition-colors"
                          aria-label="Copy email address">
                    {copied ? "Copied" : "Copy"}
                  </button>
                </div>
              </Reveal>
              <Reveal as="li" delay={120}>
                <a href={PROFILE.linkedin} target="_blank" rel="noopener noreferrer" className={rowCls}>
                  <Icon name="linkedin" size={17} className="text-acc shrink-0" />
                  <span>
                    <span className="block font-mono text-[10px] uppercase tracking-widest text-mut">LinkedIn</span>
                    <span className="block text-sm text-txt">in/hassan-ashraf-abu-algood</span>
                  </span>
                  <Icon name="externalLink" size={14} className="text-mut ml-auto" />
                </a>
              </Reveal>
              <Reveal as="li" delay={180}>
                {PROFILE.github ? (
                  <a href={PROFILE.github} target="_blank" rel="noopener noreferrer" className={rowCls}>
                    <Icon name="github" size={17} className="text-acc shrink-0" />
                    <span>
                      <span className="block font-mono text-[10px] uppercase tracking-widest text-mut">GitHub</span>
                      <span className="block text-sm text-txt">{PROFILE.github.replace("https://", "")}</span>
                    </span>
                    <Icon name="externalLink" size={14} className="text-mut ml-auto" />
                  </a>
                ) : (
                  <div className="flex items-center gap-3 border border-dashed border-line rounded-lg px-4 py-3.5 opacity-70">
                    <Icon name="github" size={17} className="text-mut shrink-0" />
                    <span>
                      <span className="block font-mono text-[10px] uppercase tracking-widest text-mut">GitHub</span>
                      <span className="block text-sm text-mut">Link coming soon</span>
                    </span>
                  </div>
                )}
              </Reveal>
              <Reveal as="li" delay={240}>
                <a href={PROFILE.phoneHref} className={rowCls}>
                  <Icon name="phone" size={17} className="text-acc shrink-0" />
                  <span>
                    <span className="block font-mono text-[10px] uppercase tracking-widest text-mut">Phone</span>
                    <span className="block text-sm text-txt">{PROFILE.phone}</span>
                  </span>
                </a>
              </Reveal>
            </ul>
          </div>

          <Reveal delay={140}>
            <form onSubmit={onSubmit} className="border border-line rounded-lg bg-panel p-6 sm:p-7">
              <h3 className="font-disp text-lg font-semibold text-txt mb-1">Send a message</h3>
              <p className="text-mut text-xs mb-5 font-mono">// opens your email client, pre-filled</p>
              <div className="space-y-4">
                <div>
                  <label htmlFor="cf-name" className="block font-mono text-[11px] uppercase tracking-widest text-mut mb-1.5">Name</label>
                  <input id="cf-name" name="name" type="text" required
                         className="w-full bg-ink border border-line rounded-md px-3.5 py-2.5 text-sm text-txt placeholder:text-mut/50 focus:border-acc focus:outline-none"
                         placeholder="Your name" />
                </div>
                <div>
                  <label htmlFor="cf-email" className="block font-mono text-[11px] uppercase tracking-widest text-mut mb-1.5">Email</label>
                  <input id="cf-email" name="email" type="email" required
                         className="w-full bg-ink border border-line rounded-md px-3.5 py-2.5 text-sm text-txt placeholder:text-mut/50 focus:border-acc focus:outline-none"
                         placeholder="you@example.com" />
                </div>
                <div>
                  <label htmlFor="cf-msg" className="block font-mono text-[11px] uppercase tracking-widest text-mut mb-1.5">Message</label>
                  <textarea id="cf-msg" name="message" rows="5" required
                            className="w-full bg-ink border border-line rounded-md px-3.5 py-2.5 text-sm text-txt placeholder:text-mut/50 focus:border-acc focus:outline-none resize-y"
                            placeholder="What would you like to discuss?"></textarea>
                </div>
                <button type="submit"
                        className="w-full inline-flex items-center justify-center gap-2 bg-acc text-ink font-semibold text-sm px-5 py-3 rounded-md hover:bg-white transition-colors">
                  <Icon name="send" size={15} /> Send Message
                </button>
              </div>
            </form>
          </Reveal>
        </div>
      </div>

      {toast && (
        <div role="status" className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-panel border border-acc/40 text-txt text-sm px-4 py-2.5 rounded-md font-mono shadow-xl shadow-black/40">
          {toast}
        </div>
      )}
    </section>
  );
}

function Footer() {
  return (
    <footer className="border-t border-line py-8">
      <div className="max-w-6xl mx-auto px-5 sm:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
        <p className="font-mono text-xs text-mut">
          © {new Date().getFullYear()} Hassan Ashraf Abu-Algood <span className="text-acc">// EOF</span>
        </p>
        <a href="#top" className="inline-flex items-center gap-1.5 font-mono text-xs text-mut hover:text-acc transition-colors">
          Back to top <Icon name="arrowUp" size={13} />
        </a>
      </div>
    </footer>
  );
}

/* =====================================================================
   5) APP
   ===================================================================== */
function App() {
  return (
    <React.Fragment>
      <a href="#main"
         className="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[100] focus:bg-acc focus:text-ink focus:px-3 focus:py-2 focus:rounded-md font-mono text-sm">
        Skip to content
      </a>
      <Nav />
      <main id="main">
        <Hero />
        <About />
        <Experience />
        <Skills />
        <Journey />
        <Labs />
        <Credentials />
        <Contact />
      </main>
      <Footer />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
